# Baken — one-command self-hosted location sharing.
#
#   cp .env.example .env                      # set BAKEN_HOST
#   cp traccar/traccar.xml.example traccar/traccar.xml
#   cp proxy/Caddyfile.example proxy/Caddyfile
#   docker compose up -d
#
# Caddy serves the viewer, proxies the API to Traccar, forwards the Overland
# bridge and the filtered device list to php-fpm, proxies address lookups to
# OpenStreetMap's Nominatim, and gets automatic HTTPS via Let's Encrypt.

services:
  traccar:
    image: traccar/traccar:6.5-alpine
    container_name: baken-traccar
    restart: unless-stopped
    volumes:
      - ./traccar/data:/opt/traccar/data
      - ./traccar/logs:/opt/traccar/logs
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    ports:
      # Traccar admin UI, bound to localhost ONLY (never public). Reach it for
      # admin tasks (users, devices, permissions) via an SSH tunnel:
      #   ssh -L 8082:localhost:8082 you@your-server   then open http://localhost:8082
      - "127.0.0.1:8082:8082"
    expose:
      - "5055"   # OsmAnd device-publish (Traccar Client app + Overland bridge), internal only
    # Caddy reaches the API at traccar:8082 over the Docker network regardless.

  bridge:
    # Official PHP image ships with the curl extension enabled by default.
    image: php:8.3-fpm-alpine
    container_name: baken-bridge
    restart: unless-stopped
    environment:
      - BAKEN_OSMAND_URL=http://traccar:5055/
      - BAKEN_TRACCAR_URL=http://traccar:8082/
      - BAKEN_DEFAULT_DEVICE_ID=${BAKEN_DEFAULT_DEVICE_ID:-}
    volumes:
      - ./bridge:/srv/bridge:ro
    working_dir: /srv/bridge
    depends_on:
      - traccar

  pruner:
    # Verwijdert elk kwartier posities ouder dan BAKEN_RETENTION_HOURS; de
    # nieuwste positie per apparaat blijft. Uit zolang die leeg is. Het
    # pruner-account maak je in Traccar aan (docs/ADMIN.md). Niet publiek:
    # Caddy kent deze container niet.
    image: php:8.3-cli-alpine
    container_name: baken-pruner
    restart: unless-stopped
    environment:
      - BAKEN_TRACCAR_URL=http://traccar:8082/
      - BAKEN_RETENTION_HOURS=${BAKEN_RETENTION_HOURS:-}
      - BAKEN_PRUNER_EMAIL=${BAKEN_PRUNER_EMAIL:-}
      - BAKEN_PRUNER_PASSWORD=${BAKEN_PRUNER_PASSWORD:-}
      - BAKEN_PRUNE_FLOOR=${BAKEN_PRUNE_FLOOR:-}
    volumes:
      - ./pruner:/srv/pruner:ro
    # Eén ronde per kwartier: "24 uur" is dan hooguit 24¼ uur. Een ronde die
    # faalt logt en de volgende probeert het opnieuw (docker compose logs pruner).
    command: ["sh", "-c", "sleep 60; while :; do php /srv/pruner/prune.php; sleep 900; done"]
    depends_on:
      - traccar

  caddy:
    image: caddy:2-alpine
    container_name: baken-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BAKEN_HOST=${BAKEN_HOST}
      - BAKEN_CONTACT=${BAKEN_CONTACT:-}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./viewer:/srv/viewer:ro
      - ./bridge:/srv/bridge:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - traccar
      - bridge

volumes:
  caddy_data:
  caddy_config:
